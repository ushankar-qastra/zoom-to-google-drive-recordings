name: Zoom recordings to Drive

# Each batch is copied a while after its class ends (times in IST):
#   Playwright weekend  (class 10:30 AM) -> 3:00 PM   = 09:30 UTC
#   Playwright weekday  (class  4:30 PM) -> 7:30 PM   = 14:00 UTC
#   AI/ML               (class  7:00 PM) -> 10:00 PM  = 16:30 UTC
# Runs every day; on days without a class it finds nothing and finishes in seconds.
# Each run also re-checks the previous 2 days, so a recording Zoom hadn't finished
# processing yet is picked up by the next run.

on:
  schedule:
    - cron: "30 9 * * *"
    - cron: "0 14 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Which batch"
        type: choice
        options: [all, ai, pw-weekday, pw-weekend]
        default: all
      dry_run:
        description: "Dry run (only list what would be copied)"
        type: boolean
        default: true

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: copy-${{ github.event.schedule || inputs.batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python zoom_to_drive.py
        env:
          ONLY_BATCH: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.batch
             || github.event.schedule == '30 9 * * *' && 'pw-weekend'
             || github.event.schedule == '0 14 * * *' && 'pw-weekday'
             || github.event.schedule == '30 16 * * *' && 'ai'
             || 'all' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
